<script>
/* ================= حالة عامة ================= */
let BOOTING=true, DB=null, ASSETS=null, USER=null, DL=null, MYID=null, CANWRITE=true, ONLINE=false;
const S={members:[],docs:[],allMembers:[],allDocs:[],settings:{remindDays:60},got:{m:false,d:false}};
let view={name:'home',q:''};
const AUTH={loaded:false,list:[],me:null,owner:false,ownerReset:false};

/* ================= أدوات ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const uniq=a=>[...new Set(a.filter(Boolean))];
const norm=s=>String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْ]/g,'');
const blobUrl=id=>'/_blob/'+id;
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500);}
function parseD(s){if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);if(!y)return null;return new Date(y,m-1,d);}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function daysUntil(s){const d=parseD(s);return d?Math.round((d-today())/864e5):null;}
function fmtD(s){const d=parseD(s);return d?d.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}):'—';}
function daysTxt(n){if(n===1)return 'يوم واحد';if(n===2)return 'يومين';if(n>=3&&n<=10)return n+' أيام';return n+' يوماً';}
function age(s){const b=parseD(s);if(!b)return null;const t=today();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a;}
function nextBday(s){const b=parseD(s);if(!b)return null;const t=today();let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return{days:Math.round((n-t)/864e5),turns:n.getFullYear()-b.getFullYear(),date:n};}
const bdayLabel=nb=>nb.days===0?'اليوم 🎉':(nb.days===1?'غداً':'بعد '+daysTxt(nb.days));
const DOC_TYPES=[['passport','جواز السفر','🛂'],['cpr','البطاقة السكانية (الهوية)','🪪'],['license','رخصة السياقة','🚗'],['vehicle','ملكية المركبة','📄'],['birth','شهادة الميلاد','👶'],['edu','شهادة دراسية','🎓'],['insurance','وثيقة تأمين','🛡️'],['property','عقد / وثيقة ملكية','🏠'],['other','مستند آخر','📁']];
const dtype=k=>DOC_TYPES.find(t=>t[0]===k)||DOC_TYPES[DOC_TYPES.length-1];
const byId=id=>S.members.find(m=>m.id===id);
function docStatus(d){const n=daysUntil(d.expiryDate);if(n===null)return{k:'none',label:'بدون تاريخ انتهاء',n:99999};
  if(n<0)return{k:'expired',label:'منتهي منذ '+daysTxt(-n),n};
  const r=+d.remindDays||+S.settings.remindDays||60;
  if(n<=r)return{k:'soon',label:n===0?'ينتهي اليوم':'ينتهي بعد '+daysTxt(n),n};
  return{k:'ok',label:'ساري المفعول',n};}
const alertsList=()=>S.docs.map(d=>({d,s:docStatus(d)})).filter(o=>o.s.k==='expired'||o.s.k==='soon').sort((a,b)=>a.s.n-b.s.n);
const upcomingBdays=lim=>S.members.map(x=>({x,b:nextBday(x.birthDate)})).filter(o=>o.b&&o.b.days<=lim).sort((a,b)=>a.b.days-b.b.days);
function avatar(x,cls=''){return x.photo?`<img class="av ${cls}" src="${blobUrl(esc(x.photo))}" alt="">`:`<div class="av ${cls}">${esc((x.name||'؟').trim().charAt(0))}</div>`;}
const isImg=f=>/^image\//.test(f.type||'');
const W=()=>CANWRITE&&ONLINE;

/* ================= الدخول ================= */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha(t){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));}
async function pbk(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256));}
const unorm=u=>norm(String(u||'').trim()).replace(/\s+/g,' ');
async function acctId(u){return 'u'+(await sha('abu-yaser:'+unorm(u))).slice(0,32);}
function sess(v){try{if(v===undefined)return JSON.parse(sessionStorage.getItem('aby-sess')||'null');if(v===null)sessionStorage.removeItem('aby-sess');else sessionStorage.setItem('aby-sess',JSON.stringify(v));}catch(_){return null;}}
function applyScope(){const me=AUTH.me;
  if(!me||me.scope!=='some'){S.members=S.allMembers;S.docs=S.allDocs;return;}
  const ok=new Set(me.memberIds||[]);S.members=S.allMembers.filter(x=>ok.has(x.id)||(x.createdByAcct&&x.createdByAcct===me.id));
  const ids=new Set(S.members.map(x=>x.id));S.docs=S.allDocs.filter(d=>ids.has(d.memberId));}
function resolveMe(){const sv=sess();AUTH.me=sv?AUTH.list.find(a=>a.id===sv.id&&String(a.hash).slice(0,16)===sv.h)||null:(AUTH.me&&AUTH.list.find(a=>a.id===AUTH.me.id&&a.hash===AUTH.me.hash))||null;}
async function createAcct(u,p,extra={}){const id=await acctId(u);const salt=uid()+uid();const hash=await pbk(p,salt);const o={scope:'all',memberIds:[],...extra,username:u.trim(),salt,hash,createdAt:Date.now(),createdBy:MYID||null};await DB.collection('logins').doc(id).set(o);return{id,...o};}
function signIn(a){AUTH.me=a;applyScope();sess({id:a.id,h:String(a.hash).slice(0,16)});AUTH.ownerReset=false;view={name:'home',q:''};render();}
function loginHtml(){return `<div class="authbox panel"><div class="mono" aria-hidden="true">ع</div><h2 style="margin:0">أرشيف أبو ياسر</h2><p class="muted small" style="margin:4px 0 0">أدخل اسم المستخدم وكلمة المرور للمتابعة</p>
  <form id="loginForm" novalidate><label class="f">اسم المستخدم<input id="lg-u" autocomplete="username" required></label><label class="f">كلمة المرور<input id="lg-p" type="password" autocomplete="current-password" required></label><div id="lg-err" class="small" style="color:var(--red);min-height:1.2em"></div><button class="btn" type="submit">دخول</button></form>
  ${!AUTH.owner&&(!AUTH.list.length||!CANWRITE)?`<div class="banner g small" style="margin-top:12px;text-align:right">حسابك في Claude لم يُمنح صلاحية الدخول إلى الأرشيف بعد. اطلب من أبو ياسر أن يدعوك ببريدك الإلكتروني بصلاحية «محرّر»، ثم افتح الرابط من جديد.</div>`:''}
  ${AUTH.owner?'<p class="small" style="margin-bottom:0"><button class="lnk" data-act="ownerSetup">نسيت كلمة المرور؟ إنشاء حساب دخول جديد (لصاحب الأرشيف)</button></p>':'<p class="muted small" style="margin-bottom:0">ليس لديك حساب؟ اطلب من أبو ياسر إنشاء حساب لك.</p>'}</div>`;}
function setupHtml(){if(!AUTH.owner)return `<div class="authbox panel"><div class="mono" aria-hidden="true">ع</div><h2>أرشيف أبو ياسر</h2><p class="muted">لم تُفعَّل حسابات الدخول بعد. سيُرسل إليك أبو ياسر اسم المستخدم وكلمة المرور.</p></div>`;
  return `<div class="authbox panel"><div class="mono" aria-hidden="true">ع</div><h2 style="margin:0">${AUTH.list.length?'إنشاء حساب دخول جديد':'تفعيل الدخول بكلمة مرور'}</h2><p class="muted small" style="margin:4px 0 0">${AUTH.list.length?'تظهر هذه الشاشة لك وحدك بصفتك صاحب الأرشيف. إذا كتبت اسم مستخدم موجوداً تُستبدل كلمة مروره.':'أنشئ حسابك أولاً، ثم أضف حسابات أفراد العائلة من صفحة الإعدادات.'}</p>
  <form id="setupForm" novalidate><label class="f">اسم المستخدم<input id="su-u" autocomplete="username" required></label><label class="f">كلمة المرور (4 أحرف على الأقل)<input id="su-p" type="password" autocomplete="new-password" required></label><label class="f">تأكيد كلمة المرور<input id="su-p2" type="password" autocomplete="new-password" required></label><div id="su-err" class="small" style="color:var(--red);min-height:1.2em"></div><button class="btn" type="submit">حفظ والدخول</button></form>
  ${AUTH.list.length?'<p class="small" style="margin-bottom:0"><button class="lnk" data-act="cancelSetup">رجوع إلى تسجيل الدخول</button></p>':''}</div>`;}
function bindAuth(){const lf=$('#loginForm');if(lf)lf.onsubmit=async e=>{e.preventDefault();const err=$('#lg-err');const b=lf.querySelector('button');err.textContent='';
    const u=$('#lg-u').value,p=$('#lg-p').value;if(!u.trim()||!p){err.textContent='اكتب اسم المستخدم وكلمة المرور.';return;}
    b.disabled=true;b.textContent='جارٍ التحقق…';
    try{const id=await acctId(u);const a=AUTH.list.find(x=>x.id===id);if(a&&await pbk(p,a.salt)===a.hash){signIn(a);return;}err.textContent=AUTH.list.length?'اسم المستخدم أو كلمة المرور غير صحيحة.':'حسابك في Claude لم يُمنح صلاحية الدخول إلى الأرشيف بعد. اطلب من أبو ياسر أن يدعوك ببريدك الإلكتروني بصلاحية «محرّر»، ثم افتح الرابط من جديد.';}catch(_){err.textContent='تعذّر التحقق، أعد المحاولة.';}
    b.disabled=false;b.textContent='دخول';};
  const sf=$('#setupForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const err=$('#su-err');const b=sf.querySelector('button');err.textContent='';
    const u=$('#su-u').value,p=$('#su-p').value,p2=$('#su-p2').value;
    if(!u.trim())return err.textContent='اكتب اسم المستخدم.';if(p.length<4)return err.textContent='كلمة المرور قصيرة؛ اكتب 4 أحرف على الأقل.';if(p!==p2)return err.textContent='كلمتا المرور غير متطابقتين.';
    b.disabled=true;try{signIn(await createAcct(u,p));toast('تم إنشاء الحساب وتسجيل دخولك');}catch(er){err.textContent=errMsg(er);b.disabled=false;}};}

/* ================= العرض ================= */
function go(name,p={}){view={name,...p};render();window.scrollTo(0,0);}
function render(){
  const ae=document.activeElement;const keep=ae&&ae.id&&ae.closest('#main')?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const al=alertsList();const pc=$('#navAlertCount');pc.textContent=al.length;pc.hidden=!al.length;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===view.name||(['member','search'].includes(view.name)&&b.dataset.v==='home')));
  const m=$('#main');
  if(!ONLINE){m.innerHTML=BOOTING?'<div class="panel empty">جارٍ تحميل الأرشيف…</div>':offlineHtml();return;}
  if(!(S.got.m&&S.got.d&&AUTH.loaded)){m.innerHTML='<div class="panel empty">جارٍ تحميل الأرشيف…</div>';return;}
  const gate=AUTH.owner&&(!AUTH.list.length||AUTH.ownerReset)?'setup':(!AUTH.me?'login':'');
  $('.nav').querySelectorAll('button[data-v]').forEach(b=>b.hidden=!!gate);$('#gform').hidden=!!gate;
  $('#navUser').hidden=!!gate;$('#navUserName').textContent=AUTH.me?'مرحباً، '+AUTH.me.username:'';
  if(gate){pc.hidden=true;if(m.dataset.screen!==gate+AUTH.owner){m.dataset.screen=gate+AUTH.owner;m.innerHTML=gate==='setup'?setupHtml():loginHtml();bindAuth();const i=m.querySelector('input');i&&i.focus();}return;}
  m.dataset.screen='';
  ({home:vHome,member:vMember,alerts:vAlerts,settings:vSettings,search:vSearch}[view.name]||vHome)(m);
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e);}catch(_){}}}
  fillNames();}

let offlineReason='';

async function fillNames(){if(!USER)return;const els=[...document.querySelectorAll('[data-uid]')];if(!els.length)return;

  <section class="panel"><h2>أعياد ميلاد خلال 30 يوماً</h2>${bd.length?`<div class="list">${bd.map(o=>`<div class="item" data-act="openMember" data-id="${esc(o.x.id)}">${avatar(o.x,'sm')}<div class="grow"><b>${esc(o.x.name)}</b><div class="small muted">${o.b.date.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long'})} — يتم ${o.b.turns} سنة</div></div><span class="badge b-soon">${bdayLabel(o.b)}</span></div>`).join('')}</div>`:'<p class="muted">لا توجد أعياد ميلاد قريبة.</p>'}</section></div>`;
  h+=`<section class="panel"><div class="row between" style="margin-bottom:14px"><h2 style="margin:0">أفراد العائلة</h2><div class="row"><input class="inp" id="mq" placeholder="تصفية بالاسم أو الأسرة…" value="${esc(view.q||'')}" aria-label="تصفية">${W()?'<button class="btn" data-act="addMember">＋ إضافة فرد</button>':''}</div></div><div id="grid"></div></section></div>`;
  m.innerHTML=h;renderGrid();$('#mq').oninput=e=>{view.q=e.target.value;renderGrid();};}

function nextExpHtml(){const up=S.docs.filter(d=>d.expiryDate).map(d=>({d,s:docStatus(d)})).sort((a,b)=>a.s.n-b.s.n).slice(0,5);
  if(!up.length)return '<p class="muted">لا توجد مستندات بتاريخ انتهاء بعد. أضف تاريخ الانتهاء لكل مستند ليظهر هنا قبل موعده.</p>';

function renderGrid(){const q=norm(view.q);const g=$('#grid');
  if(!S.members.length){g.innerHTML=`<div class="empty"><div class="big">👨‍👩‍👧‍👦</div><p>لم يُضف أي فرد بعد.<br>ابدأ بإضافة نفسك ثم الأبناء وأسرهم؛ لكل فرد بطاقة بصورته ومستنداته الرسمية وتنبيهات صلاحيتها.</p>${W()?'<button class="btn" data-act="addMember">＋ إضافة أول فرد</button>':''}${W()?'<p class="small">أو انقل بياناتك من البرنامج السابق عبر صفحة <button class="lnk" data-act="nav" data-v="settings">الإعدادات</button>.</p>':''}</div>`;return;}

function modal(title,body,onSave,saveLabel='حفظ',wide=false){const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<form class="modal${wide?' wide':''}" novalidate><h2>${title}</h2>${body}<div class="row mfoot"><button class="btn" type="submit">${saveLabel}</button><button class="btn ghost" type="button" data-close>إلغاء</button></div></form>`;
  document.body.appendChild(bg);const f=bg.querySelector('form');const close=()=>bg.remove();
  bg.addEventListener('mousedown',e=>{if(e.target===bg)close();});bg.querySelector('[data-close]').onclick=close;
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');const t=b.textContent;b.disabled=true;b.textContent='جارٍ الحفظ…';
    try{if((await onSave(f))!==false)close();}catch(err){console.error(err);toast(errMsg(err),true);}b.disabled=false;b.textContent=t;};
  setTimeout(()=>{const i=f.querySelector('input:not([type=file]):not([type=checkbox]),select,textarea');i&&i.focus();},50);return f;}
function ask(msg,ok='تأكيد',danger=true){return new Promise(res=>{const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" style="width:min(460px,100%)"><p style="margin-top:0;white-space:pre-wrap">${esc(msg)}</p><div class="row mfoot"><button class="btn ${danger?'danger':''}" data-y>${esc(ok)}</button><button class="btn ghost" data-n>إلغاء</button></div></div>`;
  document.body.appendChild(bg);const done=v=>{bg.remove();res(v);};bg.querySelector('[data-y]').onclick=()=>done(true);bg.querySelector('[data-n]').onclick=()=>done(false);bg.addEventListener('mousedown',e=>{if(e.target===bg)done(false);});bg.querySelector('[data-n]').focus();});}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'لم يُسمح بالحفظ. تأكد أن لديك صلاحية «محرّر» على الأرشيف.';
  if(c==='quota_exceeded'||c==='quota_or_state')return 'امتلأت مساحة التخزين المتاحة للأرشيف. احذف بعض المرفقات غير الضرورية ثم أعد المحاولة.';
  if(c==='too_large')return 'الملف أكبر من الحد المسموح (20 ميجابايت). صغّر حجمه ثم أعد المحاولة.';
  if(c==='unsupported_type')return 'نوع الملف غير مدعوم. المسموح: صور JPG أو PNG أو WEBP، أو ملفات PDF.';
  if(c==='rate_limited'||c==='resource_exhausted')return 'محاولات كثيرة متتالية. انتظر قليلاً ثم أعد المحاولة.';
  return 'تعذّر إتمام العملية'+(e&&e.message?': '+e.message:'');}

async function shrink(file,max){try{const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));return b||file;}catch(_){return null;}}
async function uploadFile(file,maxPx){if(!ASSETS)throw{code:'not_granted',message:'رفع الملفات غير متاح لك في هذا العرض'};
  let blob=file,type=file.type,name=file.name||'ملف';
  if(/^image\//.test(type)||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(name)){const s=await shrink(file,maxPx);if(!s)throw{code:'unsupported_type'};blob=s;type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg';}
  else if(type!=='application/pdf'&&!/\.pdf$/i.test(name))throw{code:'unsupported_type'};
  else type='application/pdf';
  const r=await ASSETS.upload(blob,{type});return{id:r.id,name,type};}
async function dropAsset(id){if(!ASSETS||!id)return;try{await ASSETS.delete(id);}catch(_){}}

const SLOTS=[['cpr','البطاقة الذكية (السكانية)','🪪',[['front','الوجه الأمامي'],['back','الوجه الخلفي']]],['passport','جواز السفر','🛂',[['main','صفحة البيانات']]],['license','رخصة السياقة (الليسن)','🚗',[['front','الوجه الأمامي'],['back','الوجه الخلفي']]]];

function slotsHtml(x){const mine=x.id?S.docs.filter(d=>d.memberId===x.id):[];const up=!!ASSETS;

  if(!up)h+=`<div class="full small muted">إرفاق الصور متاح لصاحب الأرشيف والمحرّرين.</div>`;
  return h;}
const extOf=n=>{const i=String(n).lastIndexOf('.');return i>0?String(n).slice(i):'';};
async function saveSlots(fd,memberId){
  for(const [k,label,,sides] of SLOTS){const ex=S.docs.find(d=>d.memberId===memberId&&d.type===k);
    const num=(fd.get(`s-${k}-num`)||'').trim(),exp=fd.get(`s-${k}-exp`)||'';
    const add=[];for(const [sd,sl] of sides){const fl=fd.get(`s-${k}-${sd}`);if(fl&&fl.size){const r=await uploadFile(fl,1800);r.name=`${label} - ${sl}${extOf(r.name)}`;add.push(r);}}
    if(!ex&&!add.length&&!num&&!exp)continue;
    if(ex&&!add.length&&num===(ex.number||'')&&exp===(ex.expiryDate||''))continue;
    const prefixes=add.map(a=>a.name.replace(/\.[^.]+$/,''));
    const old=(ex&&ex.files)||[];const replaced=old.filter(f=>prefixes.some(p=>f.name.startsWith(p)));
    const o=stamp({memberId,type:k,title:ex&&ex.title||'',number:num,issueDate:ex&&ex.issueDate||'',expiryDate:exp,remindDays:ex&&ex.remindDays||+S.settings.remindDays||60,notes:ex&&ex.notes||'',files:[...old.filter(f=>!replaced.includes(f)),...add],createdAt:ex&&ex.createdAt||Date.now(),createdBy:ex&&ex.createdBy||MYID||null});
    await DB.collection('docs').doc(ex?ex.id:uid()).set(o);replaced.forEach(f=>dropAsset(f.id));}
  const t=(fd.get('s-other-title')||'').trim(),num=(fd.get('s-other-num')||'').trim(),exp=fd.get('s-other-exp')||'';
  const files=[];for(const fl of fd.getAll('s-other-files')){if(fl&&fl.size)files.push(await uploadFile(fl,1800));}
  if(t||files.length||exp||num){await DB.collection('docs').doc(uid()).set(stamp({memberId,type:'other',title:t||'مستند آخر',number:num,issueDate:'',expiryDate:exp,remindDays:+S.settings.remindDays||60,notes:'',files,createdAt:Date.now(),createdBy:MYID||null}));}}
function openMemberForm(x={}){const f=modal(x.id?'تعديل بيانات '+esc(x.name):'إضافة فرد جديد',memberForm(x),async f=>{const fd=new FormData(f);const name=(fd.get('name')||'').trim();if(!name){toast('اكتب الاسم أولاً',true);return false;}

let lb={items:[],i:0,el:null};
function openViewer(items,i){lb.items=items;lb.i=i;if(!lb.el){lb.el=document.createElement('div');lb.el.className='lb';document.body.appendChild(lb.el);lb.el.addEventListener('mousedown',e=>{if(e.target.classList.contains('stage'))closeViewer();});}showLb();}
function closeViewer(){lb.el&&lb.el.remove();lb.el=null;}
function showLb(){const f=lb.items[lb.i];const n=lb.items.length;const u=blobUrl(esc(f.id));
  const inner=isImg(f)?`<img src="${u}" alt="">`:`<iframe src="${u}" title="${esc(f.name)}"></iframe>`;
  lb.el.innerHTML=`<div class="stage">${inner}</div><div class="tb">${DL?'<button class="btn sm gold" data-lb="d">تنزيل نسخة</button>':''}<a class="btn sm ghost" href="${u}" target="_blank" rel="noopener">فتح في نافذة جديدة</a><button class="btn sm ghost" data-lb="x">✕ إغلاق</button></div>
  ${n>1?'<button class="nb prev" data-lb="p" aria-label="السابق">›</button><button class="nb next" data-lb="n" aria-label="التالي">‹</button>':''}<div class="cap">${esc(f.name)}${n>1?` — ${lb.i+1} من ${n}`:''}</div>`;
  lb.el.querySelectorAll('[data-lb]').forEach(b=>b.onclick=async()=>{const a=b.dataset.lb;
    if(a==='x')return closeViewer();
    if(a==='d'){try{const r=await fetch(blobUrl(f.id));if(!r.ok)throw new Error(r.status);await DL.save({filename:f.name,data:await r.blob()});}catch(e){if(e&&e.code!=='declined')toast('تعذّر تنزيل الملف',true);}return;}
    lb.i=(lb.i+(a==='n'?1:-1)+n)%n;showLb();});}
document.addEventListener('keydown',e=>{if(!lb.el)return;const n=lb.items.length;if(e.key==='Escape')closeViewer();else if(n>1&&e.key==='ArrowLeft'){lb.i=(lb.i+1)%n;showLb();}else if(n>1&&e.key==='ArrowRight'){lb.i=(lb.i-1+n)%n;showLb();}});

  S.allMembers.forEach(x=>{const k=x.family||'أفراد آخرون';(groups[k]=groups[k]||[]).push(x);});
  const keys=Object.keys(groups).sort((x,y)=>x==='أفراد آخرون'?1:y==='أفراد آخرون'?-1:x.localeCompare(y,'ar'));
  return `<div class="full"><div class="small" style="font-weight:800;margin-bottom:4px">من يستطيع هذا المستخدم أن يرى؟</div>
  <label class="small" style="display:block"><input type="radio" name="scope" value="all" ${some?'':'checked'}> جميع أفراد العائلة ومستنداتهم</label>
  <label class="small" style="display:block"><input type="radio" name="scope" value="some" ${some?'checked':''}> أفراد محددون فقط (اختر من القائمة):</label>
  <div class="pick">${S.allMembers.length?keys.map(k=>`<div class="gt">${esc(k)}</div><div>${groups[k].map(x=>`<label><input type="checkbox" name="mids" value="${esc(x.id)}" ${sel.has(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</div>`).join(''):'<span class="small muted">لم يُضف أي فرد بعد.</span>'}</div>
  <div class="small muted" style="margin-top:6px">يرى المستخدم أيضاً أي فرد يضيفه هو بنفسه.</div></div>`;}
function readScope(fd){const scope=fd.get('scope')==='some'?'some':'all';return{scope,memberIds:scope==='some'?fd.getAll('mids'):[]};}
function acctForm(title,a,o,onDone){const pw=o.pw!==false,sc=o.scope!==false,lockU=!!a;
  modal(title,`<div class="form"><label class="f full">اسم المستخدم<input id="ac-u" name="u" value="${esc(a?a.username:'')}" ${lockU?'readonly':''} autocomplete="off"></label>
  ${pw?`<label class="f">كلمة المرور (4 أحرف على الأقل)<input id="ac-p" name="p" type="password" autocomplete="new-password"></label><label class="f">تأكيد كلمة المرور<input id="ac-p2" name="p2" type="password" autocomplete="new-password"></label>`:''}
  ${sc?scopeHtml(a):''}</div>`,async f=>{const fd=new FormData(f);const uu=(fd.get('u')||'').trim(),p=fd.get('p')||'';
    if(!uu){toast('اكتب اسم المستخدم',true);return false;}
    const scope=sc?readScope(fd):{scope:(a&&a.scope)||'all',memberIds:(a&&a.memberIds)||[]};
    if(sc&&scope.scope==='some'&&!scope.memberIds.length){toast('اختر فرداً واحداً على الأقل، أو اختر «جميع أفراد العائلة»',true);return false;}
    if(!pw){await DB.collection('logins').doc(a.id).update({scope:scope.scope,memberIds:scope.memberIds});onDone&&onDone();return;}
    if(p.length<4){toast('كلمة المرور قصيرة؛ اكتب 4 أحرف على الأقل',true);return false;}if(p!==fd.get('p2')){toast('كلمتا المرور غير متطابقتين',true);return false;}
    if(!lockU&&AUTH.list.some(x=>unorm(x.username)===unorm(uu))){toast('اسم المستخدم مستخدم من قبل؛ اختر اسماً آخر',true);return false;}
    const n=await createAcct(uu,p,scope);onDone&&onDone(n);},'حفظ',sc);}
const ACT={
  logout:()=>{sess(null);AUTH.me=null;applyScope();view={name:'home',q:''};render();},
  ownerSetup:()=>{AUTH.ownerReset=true;render();},
  cancelSetup:()=>{AUTH.ownerReset=false;render();},
  addAcct:()=>acctForm('إضافة حساب دخول',null,{},a=>toast(`تم إنشاء حساب «${a.username}». أرسل له اسم المستخدم وكلمة المرور.`)),
  scopeAcct:d=>{const a=AUTH.list.find(x=>x.id===d.id);acctForm('من يرى «'+esc(a.username)+'»؟',a,{pw:false},()=>toast('تم حفظ الصلاحيات'));},
  resetAcct:d=>{const a=AUTH.list.find(x=>x.id===d.id);acctForm('تغيير كلمة مرور «'+esc(a.username)+'»',a,{scope:false},n=>{if(AUTH.me&&AUTH.me.id===n.id)signIn(n);toast('تم تغيير كلمة المرور');});},
  delAcct:async d=>{const a=AUTH.list.find(x=>x.id===d.id);if(!(await ask(`حذف حساب الدخول «${a.username}»؟ لن يستطيع صاحبه الدخول بعد ذلك. (لا تُحذف أي بيانات من الأرشيف)`,'حذف الحساب')))return;await DB.collection('logins').doc(a.id).delete();toast('تم حذف الحساب');},
  nav:d=>go(d.v),
  openMember:d=>d.id&&go('member',{id:d.id}),
  addMember:()=>openMemberForm({}),
  editMember:d=>openMemberForm(byId(d.id)),
  delMember:async d=>{const x=byId(d.id);const mine=S.docs.filter(o=>o.memberId===x.id);
    if(!(await ask(`هل تريد حذف «${x.name}» من الأرشيف؟\nسيُحذف معه ${mine.length} مستند ومرفقاته لجميع المشاركين، ولا يمكن التراجع عن ذلك.`,'حذف نهائي')))return;
    for(const o of mine){await DB.collection('docs').doc(o.id).delete();(o.files||[]).forEach(f=>dropAsset(f.id));}
    await DB.collection('members').doc(x.id).delete();dropAsset(x.photo);toast('تم الحذف');go('home');},
  addDoc:d=>openDocForm({memberId:d.id}),
  editDoc:d=>openDocForm(S.docs.find(o=>o.id===d.id)),
  delDoc:async d=>{const o=S.docs.find(x=>x.id===d.id);if(!(await ask(`حذف مستند «${o.title||dtype(o.type)[1]}» ومرفقاته لجميع المشاركين؟`,'حذف')))return;
    await DB.collection('docs').doc(o.id).delete();(o.files||[]).forEach(f=>dropAsset(f.id));toast('تم الحذف');},
  viewDoc:d=>{const o=S.docs.find(x=>x.id===d.id);openViewer(o.files,+d.i);},
  saveSettings:async()=>{const v=Math.max(1,+$('#setRemind').value||60);await DB.collection('settings').doc('main').set(stamp({remindDays:v}));toast('تم الحفظ');},
  exportJson:async()=>{const data=JSON.stringify({app:'abu-yaser-archive-online',date:new Date().toISOString(),settings:S.settings,members:S.members,docs:S.docs},null,1);
    try{await DL.save({filename:`أرشيف أبو ياسر - بيانات - ${new Date().toISOString().slice(0,10)}.json`,data});toast('تم تنزيل النسخة');}catch(e){if(e&&e.code!=='declined')toast('تعذّر التنزيل',true);}},
  exportCsv:async()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['الفرد','صلة القرابة','المستند','الرقم','تاريخ الإصدار','تاريخ الانتهاء','الحالة','ملاحظات']];
    S.docs.slice().sort((a,b)=>docStatus(a).n-docStatus(b).n).forEach(d=>{const x=byId(d.memberId)||{};rows.push([x.name,x.relation,d.title||dtype(d.type)[1],d.number,d.issueDate,d.expiryDate,docStatus(d).label,d.notes]);});
    try{await DL.save({filename:`أرشيف أبو ياسر - جدول المستندات - ${new Date().toISOString().slice(0,10)}.csv`,data:'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')});toast('تم التنزيل');}catch(e){if(e&&e.code!=='declined')toast('تعذّر التنزيل',true);}},
  importBk:()=>$('#importInp').click()
};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('.modal'))return;e.preventDefault();const fn=ACT[t.dataset.act];if(!fn)return;
  try{await fn(t.dataset);}catch(err){console.error(err);toast(errMsg(err),true);}});
document.addEventListener('change',async e=>{const t=e.target.closest&&e.target.closest('[data-chg="exp"]');if(!t||!W())return;
  const d=S.docs.find(o=>o.id===t.dataset.id);if(!d||(d.expiryDate||'')===t.value)return;
  try{await DB.collection('docs').doc(d.id).update({expiryDate:t.value,updatedAt:Date.now(),updatedBy:MYID||null});toast(t.value?'تم تحديث تاريخ الانتهاء إلى '+fmtD(t.value):'أُزيل تاريخ الانتهاء');}catch(err){toast(errMsg(err),true);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest&&e.target.closest('.mcard[data-act]');if(t)go('member',{id:t.dataset.id});}});
$('#gform').addEventListener('submit',e=>{e.preventDefault();const q=$('#gq').value.trim();if(q)go('search',{q});});

/* استيراد نسخة البرنامج السابق */
function d2b(u){const i=u.indexOf(',');const mime=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime});}
const okId=s=>/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(String(s||''))&&s!=='.'&&s!=='..';
$('#importInp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let j;try{j=JSON.parse(await f.text());if(j.app!=='abu-yaser-archive'||!Array.isArray(j.members))throw 0;}catch(_){toast('هذا الملف ليس نسخة احتياطية من برنامج «أرشيف أبو ياسر» على الكمبيوتر.',true);return;}
  if(!(await ask(`النسخة بتاريخ ${new Date(j.date).toLocaleString('ar-u-nu-latn')}\nتحتوي ${j.members.length} فرد و${(j.docs||[]).length} مستند.\n\nستُضاف إلى الأرشيف المشترك وتظهر لجميع المشاركين. السجلات الموجودة بنفس المعرّف ستُستبدل.`,'نقل البيانات',false)))return;
  let n=0,fails=0;const total=j.members.length+(j.docs||[]).length;const prog=document.createElement('div');prog.className='toast';document.body.appendChild(prog);
  const tick=()=>prog.textContent=`جارٍ النقل… ${n} من ${total}`;tick();
  const idMap={};
  try{
    for(const x of j.members){const id=okId(x.id)?x.id:uid();idMap[x.id]=id;let photo=null;
      if(x.photo&&ASSETS){try{photo=(await uploadFile(new File([d2b(x.photo)],'photo.jpg',{type:'image/jpeg'}),500)).id;}catch(_){fails++;}}
      await DB.collection('members').doc(id).set(stamp({name:x.name||'بدون اسم',relation:x.relation||'',family:x.family||'',birthDate:x.birthDate||'',phone:x.phone||'',notes:x.notes||'',photo,createdAt:x.created||Date.now(),createdBy:MYID||null}));n++;tick();}
    for(const d of (j.docs||[])){const files=[];
      for(const fl of (d.files||[])){if(!ASSETS)break;try{const b=d2b(fl.data);files.push(await uploadFile(new File([b],fl.name||'ملف',{type:fl.type||b.type}),1800));}catch(_){fails++;}}
      const id=okId(d.id)?d.id:uid();
      await DB.collection('docs').doc(id).set(stamp({memberId:idMap[d.memberId]||d.memberId,type:d.type||'other',title:d.title||'',number:d.number||'',remindDays:+d.remindDays||60,issueDate:d.issueDate||'',expiryDate:d.expiryDate||'',notes:d.notes||'',files,createdAt:d.updated||Date.now(),createdBy:MYID||null}));n++;tick();}
    prog.remove();toast(`تم نقل ${n} سجل${fails?` — تعذّر رفع ${fails} مرفق`:''}`,!!fails);go('home');
  }catch(err){prog.remove();toast(errMsg(err),true);}});

/* ================= التشغيل ================= */
render();
(async()=>{
  BOOTING=false;
  if(!window.claude||typeof window.claude.use!=='function'){render();return;}
  BOOTING=true;[DB,USER]=await Promise.all([claude.use('db'),claude.use('user')]);BOOTING=false;
  if(!DB){offlineReason='لا يمكن فتح الأرشيف المشترك الآن، إما لأنك غير مسجّل الدخول أو لأن صاحب الأرشيف لم يشاركه معك.';render();return;}
  ONLINE=true;
  MYID=USER?await USER.id():null;AUTH.owner=USER?await USER.isOwner():false;
  DB.collection('logins').onSnapshot(s=>{AUTH.list=s.docs.map(d=>({id:d.id,...d.data()}));AUTH.loaded=true;resolveMe();applyScope();if(!AUTH.list.length)sess(null);document.getElementById('main').dataset.screen='';render();},e=>{console.error(e);AUTH.loaded=true;render();});
  const cw=USER?await USER.can('data.write'):null;if(cw===false)CANWRITE=false;
  render();
  const onErr=e=>{console.error(e);if(e&&e.code==='revoked'){ONLINE=false;offlineReason='توقف الوصول إلى الأرشيف.';}else if(e&&e.code==='unavailable'){setTimeout(()=>location.reload(),3000);}render();};
  DB.collection('members').onSnapshot(s=>{S.allMembers=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));applyScope();S.got.m=true;render();},onErr);
  DB.collection('docs').onSnapshot(s=>{S.allDocs=s.docs.map(d=>({id:d.id,...d.data()}));applyScope();S.got.d=true;render();},onErr);
  DB.doc('settings/main').onSnapshot(s=>{S.settings=Object.assign({remindDays:60},s.exists?s.data():{});render();},onErr);
  Promise.all([claude.use('assets'),claude.use('downloads')]).then(([a,d])=>{ASSETS=a;DL=d;render();});
})();
</script>
